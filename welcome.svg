<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Welcome to my GitHub">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07140f"/>
      <stop offset="48%" stop-color="#145c38">
        <animate attributeName="offset" values="0.32;0.68;0.32" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#04110c"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="55%" r="42%">
      <stop offset="0%" stop-color="#b6ff7a" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#1f8a4c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1f8a4c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4c8"/>
      <stop offset="45%" stop-color="#e7c56a"/>
      <stop offset="100%" stop-color="#a67c2d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f4ffd8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .letter {
        opacity: 0;
        animation: appear 0.35s ease forwards;
      }
      @keyframes appear {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </defs>
  <rect width="1200" height="200" fill="url(#bg)"/>
  <rect width="1200" height="200" fill="url(#aura)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <g fill="none" stroke="#d4af55" stroke-opacity="0.85">
    <rect x="18" y="14" width="1164" height="172" stroke-width="1.4"/>
    <rect x="26" y="22" width="1148" height="156" stroke-width="0.6" stroke-opacity="0.55"/>
  </g>
  <g transform="translate(92 100)" filter="url(#glow)">
    <polygon points="0,-28 6.5,-8 28,-8 10.5,4 16.5,26 0,13 -16.5,26 -10.5,4 -28,-8 -6.5,-8" fill="url(#gold)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.8s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <circle cx="1040" cy="46" r="2" fill="#f4ffd2">
    <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="990" cy="158" r="1.6" fill="#c6f59a">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="164" r="1.5" fill="#f6e7a8">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.9s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <text x="640" y="116" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="42" font-weight="700" fill="#f6e7a8">
    <tspan class="letter" style="animation-delay:0.12s">W</tspan>
    <tspan class="letter" style="animation-delay:0.22s">e</tspan>
    <tspan class="letter" style="animation-delay:0.32s">l</tspan>
    <tspan class="letter" style="animation-delay:0.42s">c</tspan>
    <tspan class="letter" style="animation-delay:0.52s">o</tspan>
    <tspan class="letter" style="animation-delay:0.62s">m</tspan>
    <tspan class="letter" style="animation-delay:0.72s">e</tspan>
    <tspan class="letter" style="animation-delay:0.82s">&#160;</tspan>
    <tspan class="letter" style="animation-delay:0.92s">i</tspan>
    <tspan class="letter" style="animation-delay:1.02s">'</tspan>
    <tspan class="letter" style="animation-delay:1.12s">m</tspan>
    <tspan class="letter" style="animation-delay:1.22s">&#160;</tspan>
    <tspan class="letter" style="animation-delay:1.32s">l</tspan>
    <tspan class="letter" style="animation-delay:1.42s">u</tspan>
    <tspan class="letter" style="animation-delay:1.52s">c</tspan>
    <tspan class="letter" style="animation-delay:1.62s">c</tspan>
    <tspan class="letter" style="animation-delay:1.72s">i</tspan>
  </text>
  <rect x="-200" y="0" width="140" height="200" fill="url(#shine)">
    <animate attributeName="x" from="-200" to="1260" dur="5.2s" begin="2.3s" repeatCount="indefinite"/>
  </rect>
</svg>
